name: Diagnose installed Windows ODBC package
on:
  push:
    branches: [codex/odbc-1.0.1]
    paths:
      - '.github/workflows/windows-package-check.yml'
      - 'test/e2e/windows_api_diagnostic.py'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Build run containing the Windows MSI candidate'
        default: '39407167466'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maxcompute-odbc-windows-x64-msi
          path: package
          run-id: ${{ github.event.inputs.artifact_run_id || '39407167466' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install candidate and isolate statement API calls
        shell: pwsh
        run: |
          $msi = (Get-ChildItem package/*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Install failed: $($install.ExitCode)" }
          python -X faulthandler -u test/e2e/windows_api_diagnostic.py direct
          python -X faulthandler -u test/e2e/windows_api_diagnostic.py manager typeinfo
